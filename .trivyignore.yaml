# Accepted findings, each with the reason it is accepted rather than
# fixed. Anything not listed here is expected to be fixed, not muted.
#
# A suppression without a justification is indistinguishable from not
# having run the scanner, so every entry states what the risk is and why
# it is being taken. Entries with a date are things to revisit, not
# permanent exemptions.

misconfigurations:
  - id: AVD-AWS-0104
    paths:
      - "terraform/aws/security.tf"
    statement: >-
      Unrestricted egress destination. Already narrowed from every
      protocol and port to TCP 443 and 80 only. The remaining 0.0.0.0/0
      is for package installation at boot and for KMS, S3 and SSM, which
      have no fixed address ranges worth encoding. Properly removing it
      needs interface VPC endpoints for KMS, SSM and SSM Messages, plus a
      prebaked AMI so nothing is installed at boot — both are tracked
      work, not a security group change. Accepted meanwhile because the
      nodes are in private subnets with no inbound path except the load
      balancer.

  - id: AVD-AZU-0014
    paths:
      - "terraform/azure/main.tf"
    statement: >-
      Key expiry on the auto-unseal key. Deliberately not set. An expired
      key does not degrade gracefully here: every node fails to unseal on
      its next restart, and every existing Raft snapshot becomes
      undecryptable, because they are encrypted under it. Rotation is
      handled by Key Vault versioning, which keeps prior versions
      readable; expiry does not. This is a case where the generic control
      is actively wrong for the workload.

  - id: AVD-AWS-0089
    paths:
      - "terraform/aws/storage.tf"
    statement: >-
      S3 access logging on the snapshot bucket. Enabling it means a
      second bucket to hold the logs, which then needs its own retention,
      encryption and access policy. VPC flow logs and CloudTrail already
      cover who reached the bucket at the network and API layers. Worth
      revisiting if the snapshot bucket ever holds more than this one
      cluster's backups.

  - id: AVD-AWS-0132
    paths:
      - "terraform/aws/audit-anchors/main.tf"
    statement: >-
      SSE-S3 rather than a customer managed key on the audit anchor
      bucket. Deliberate, and the one place in this repository where the
      generic control would work against the thing being protected.

      An anchor is a sequence number and a SHA-256 hash. It is not
      secret — anyone holding the audit log can recompute it — so the
      confidentiality a CMK buys is confidentiality of nothing. What the
      bucket exists to provide is availability of evidence at the worst
      moment: after a compromise, to someone proving what was read.

      A CMK is a second thing that has to still exist and still be
      grantable at that moment, and it is reachable by exactly the
      attacker this bucket is defending against. COMPLIANCE object lock
      means they cannot delete an anchor; scheduling the key for deletion
      would leave every anchor present and undecryptable, which is the
      same outcome by another route and one the lock cannot refuse.
      Encrypting evidence under a key the attacker can destroy trades the
      property this bucket is for against one it does not need.

      This is the same shape as the argument in terraform/aws/bootstrap:
      state encrypted under the cluster's own auto-unseal key cannot be
      read without first reading the state. Here the regress is not
      circular, only fatal in one direction.

      Revisit if anchors ever carry anything but a sequence and a hash.

  - id: AVD-AZU-0012
    paths:
      - "terraform/azure/bootstrap/main.tf"
    statement: >-
      Network default_action on the Terraform state account. It is Allow
      until allowed_ip_ranges is set, and unlike the snapshot account
      beside it that is the right default rather than a lapse. Snapshots
      are written by the nodes from inside the VNet, so there is a subnet
      to allow; state is written by whoever runs terraform — a laptop, a
      CI runner, someone on call elsewhere — and there is not. An account
      that denies by default with no ip_rules is an account nobody can
      plan against, including the person who created it, and being locked
      out of the state of a running Vault cluster is the failure this
      module exists to prevent. Azure also rejects 0.0.0.0/0 in ip_rules,
      so "deny by default and allow everything explicitly" is not
      available as an escape hatch. The control that is not optional
      either way is shared_access_key_enabled = false: reaching the
      account is not the same as being able to read it, because there is
      no account key and access needs an Entra principal holding a role.
      Set allowed_ip_ranges where the set of places Terraform runs from
      is known and stable, and this becomes Deny. See
      docs/terraform-state.md.

  - id: AVD-AZU-0012
    paths:
      - "terraform/azure/audit-anchors/main.tf"
    statement: >-
      Network default_action on the audit anchor account. Allow until
      allowed_ip_ranges is set, the same arrangement as the Terraform
      state account and for a related but not identical reason.

      For state, the argument is that whoever runs terraform has no fixed
      address. Here it is narrower and stronger: the account exists to be
      readable during an incident, by somebody working from a machine
      that is deliberately not the compromised one. Writes have a network
      to come from and could be pinned; reads are the whole point and
      cannot be. An anchor bucket that denies by default with no ip_rules
      is evidence nobody can reach, which is the failure it was created
      to prevent, arriving by a different route.

      Azure rejects 0.0.0.0/0 in ip_rules, so "deny by default and allow
      everything explicitly" is not available as an escape hatch.

      What is not optional either way, and is set: shared_access_key_enabled
      = false, so reaching the account is not the same as reading it —
      there is no account key and access needs an Entra principal holding
      a role. The role this module defines cannot delete a blob, and the
      immutability policy refuses deletion regardless.

      Set allowed_ip_ranges where the set of places that fetch anchors is
      known and stable, and this becomes Deny. See docs/audit.md.

  - id: AVD-DS-0026
    paths:
      - "docker/vault/Dockerfile"
      - "docker/vault-unseal/Dockerfile"
      - "docker/tooling/Dockerfile"
    statement: >-
      No HEALTHCHECK instruction. Health is asserted where it is acted
      on instead: docker/dev is orchestrated by
      scripts/bootstrap-dev-cluster.sh, which polls sys/health and fails
      the run if a node never becomes active, and the AWS profile uses
      the load balancer's health check to decide whether to replace an
      instance. A container-level HEALTHCHECK would duplicate that
      without anything consuming the result.

  - id: AVD-DS-0002
    paths:
      - "docker/tooling/Dockerfile"
    statement: >-
      Runs as root. This image is an interactive shell for running the
      vault, terraform and ansible CLIs against a local stack; it holds
      no data and serves no network listener. The Vault server images
      (docker/vault, docker/vault-unseal) do drop to the vault user.

  - id: AVD-AZU-0057
    paths:
      - "terraform/azure/storage.tf"
    statement: >-
      Storage analytics logging on the snapshot account. Same reasoning
      as AVD-AWS-0089 on the S3 side, kept consistent deliberately: NSG
      flow logs and Azure Activity Log already cover who reached the
      account at the network and control-plane layers, and enabling
      per-service analytics logging means somewhere to put those logs
      with its own retention and access rules. Revisit if the account
      ever holds more than this one cluster's backups.

  - id: AVD-AZU-0058
    paths:
      - "terraform/azure/storage.tf"
    statement: >-
      Geo-redundant replication. ZRS is chosen deliberately: the cluster
      is single-region, so surviving the loss of an availability zone is
      the property that matters. Geo-redundancy would put snapshots in a
      paired region while the Key Vault key stays put, and a snapshot
      without its key is undecryptable — so GRS alone would give the
      appearance of cross-region recovery without the substance. Real
      cross-region DR needs a Key Vault in the second region as well,
      and that is a larger design decision than a replication setting.
