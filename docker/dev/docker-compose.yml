version: "3.8"

services:
  # OIDC identity provider for human logins (see docker/dex). Started only
  # by `bootstrap-dev-cluster.sh --with-oidc`. The published port matters
  # as much as the internal one: the browser completing a login talks to
  # Dex directly, so it has to be reachable from the host at the same
  # URL Vault uses. See docs/human-authentication.md.
  dex:
    image: dexidp/dex:v2.41.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ../dex/config.yaml:/etc/dex/config.yaml:ro

  # Auto-unseal backend for vault-0/1/2 (see docker/vault-unseal). Brought up
  # and bootstrapped first — scripts/bootstrap-dev-cluster.sh handles the
  # ordering; a bare `docker compose up` won't unseal or configure it.
  vault-unseal:
    build: ../vault-unseal
    ports:
      - "8300:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"

  vault-0:
    build:
      context: ../vault
      args:
        VAULT_NODE_ID: vault-0
    ports:
      - "8200:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      # Minted by scripts/bootstrap-dev-cluster.sh after vault-unseal is
      # ready; empty here just means "not bootstrapped yet", not a default
      # to rely on.
      VAULT_TRANSIT_TOKEN: "${VAULT_TRANSIT_TOKEN:-}"

  vault-1:
    build:
      context: ../vault
      args:
        VAULT_NODE_ID: vault-1
    ports:
      - "8210:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_TRANSIT_TOKEN: "${VAULT_TRANSIT_TOKEN:-}"

  vault-2:
    build:
      context: ../vault
      args:
        VAULT_NODE_ID: vault-2
    ports:
      - "8220:8200"
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
      VAULT_TRANSIT_TOKEN: "${VAULT_TRANSIT_TOKEN:-}"

  # Monitoring — started only by `bootstrap-dev-cluster.sh --with-monitoring`
  # (and therefore `make deploy`), not by a bare `docker compose up`.
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      # Local/dev only: anonymous admin access so the dashboard opens
      # without a login prompt. Never do this anywhere reachable.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
