services:
  # OIDC identity provider for human logins (see docker/dex). Started only
  # by `bootstrap-dev-cluster.sh --with-oidc`. The published port matters
  # as much as the internal one: the browser completing a login talks to
  # Dex directly, so it has to be reachable from the host at the same
  # URL Vault uses. See docs/human-authentication.md.
  dex:
    # v2.45.0 is the first release where staticPasswords supports a
    # "groups" field. On anything older the key is silently ignored, the
    # ID token carries no groups claim, and Vault fails the login with
    # 'failed to fetch groups' — with nothing pointing at the version.
    image: dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ../dex/config.yaml:/etc/dex/config.yaml:ro

  # Target for the database secrets engine (see docs/dynamic-secrets.md).
  # Started only by `bootstrap-dev-cluster.sh --with-database`.
  #
  # The credentials here are the *bootstrap* ones Vault uses to connect.
  # scripts/bootstrap-database-secrets.sh rotates the password immediately
  # afterwards, so what is written below stops being valid the moment the
  # engine is configured — which is the point of the exercise. Nothing
  # here is a secret worth protecting; it is deliberately visible so the
  # rotation is observable.
  postgres:
    image: postgres:16.4-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vaultadmin
      POSTGRES_PASSWORD: bootstrap-only-rotated-immediately
      POSTGRES_DB: appdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultadmin -d appdata"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A second engine behind the same Vault interface. The point is not
  # MySQL specifically -- it is that the database engine is one interface
  # over many databases, and that the differences which do leak through
  # are worth knowing before choosing one.
  #
  # The difference that matters here: MySQL cannot express an account
  # expiry, so credentials issued against it live until Vault revokes
  # them, where the Postgres roles carry VALID UNTIL and the database
  # enforces the deadline itself. See docs/dynamic-secrets.md.
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: bootstrap-only-rotated-immediately
      MYSQL_DATABASE: appdata
    volumes:
      # Creates the vaultadmin account Vault connects as. Deliberately not
      # root: the bootstrap rotates the password of whatever account it
      # uses, and root's password is what the healthcheck below needs.
      - ../mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 5s
      retries: 40

  # Receives the socket audit device's stream (see docs/audit.md).
  #
  # The point of it is failure isolation, not the collector itself. Two
  # file devices on one filesystem prove entries reach both and prove
  # nothing about surviving a full disk — the same disk fills for both.
  # A socket device fails when the network or this container does, which
  # is a genuinely separate failure domain, and lets the integration
  # tests kill one device and show Vault still serving.
  #
  # HashiCorp recommend pairing a socket device with a non-socket one,
  # because a socket device alone can block Vault when its endpoint goes
  # away. That pairing is exactly what bootstrap-audit.sh sets up.
  # Built rather than the stock alpine/socat image, because appending
  # bytes is not enough: whoever can write to the volume could remove the
  # record of what they did, and a shorter log is indistinguishable from
  # a quieter day. Each entry now also produces a link in a hash chain,
  # so an edit is visible. See docker/audit-collector/collect.sh.
  #
  # The log itself is written exactly as before -- raw entries, one per
  # line -- so anything already consuming it is unaffected. The integrity
  # data lives beside it, not inside it.
  audit-collector:
    build: ../audit-collector
    volumes:
      # A named volume, not the container filesystem. This is the whole
      # point of shipping the log anywhere: an audit trail that lives
      # only inside the thing it describes dies with it, and anything
      # able to destroy the Vault node is able to destroy the evidence of
      # what it did there.
      #
      # The volume outlives `docker compose rm` of any container, which
      # is what the integration suite checks by destroying vault-0
      # outright and reading the trail back afterwards.
      - audit-logs:/collector
    # Deliberately no host port. Vault reaches this over the container
    # network as audit-collector:9090, and the tests read the file with
    # `compose exec`, so publishing it buys nothing — and 9090 on the
    # host is Prometheus, which is how this was found.

  # Records the chain head somewhere the collector cannot reach.
  #
  # A hash chain catches whoever cannot recompute it. It does nothing
  # against whoever can: an attacker with write access to the chain file
  # deletes the entries recording what they did, recomputes every hash
  # from that point, and the result verifies perfectly. Internally
  # consistent and completely false.
  #
  # What breaks that is a copy of the head held where the attacker is
  # not. Hence a separate service: the audit volume is mounted READ-ONLY
  # here, and the anchors go on a volume the collector has no mount for
  # at all. Neither container can write where the other reads.
  #
  # This is a real separation on one host, and it is not the same thing
  # as a separate host. docs/audit.md says so plainly and describes what
  # a production anchor should be instead.
  audit-anchor:
    build: ../audit-collector
    entrypoint: ["/usr/local/bin/anchor.sh"]
    environment:
      # Shorter is safer and noisier: entries written since the last
      # anchor are covered by the chain but not yet by an anchor, so this
      # interval is the window in which a thorough attacker can still
      # rewrite history undetected.
      ANCHOR_INTERVAL: "15"
    volumes:
      - audit-logs:/collector:ro
      - audit-anchors:/anchors
    depends_on:
      - audit-collector

  # Vault Agent — the only thing here that shows how an application
  # actually consumes a secret (see docs/vault-agent.md). Started by
  # `bootstrap-dev-cluster.sh --with-agent`.
  #
  # Deliberately has no VAULT_TOKEN. It authenticates itself with an
  # AppRole whose credentials are placed on disk by bootstrap-agent.sh,
  # and renders a dynamic Postgres credential into /rendered/db.env. An
  # application reads that file and never learns Vault exists.
  vault-agent:
    build: ../vault-agent
    # ENTRYPOINT is ["vault"], so this is its arguments.
    command: ["agent", "-config=/vault/agent/agent.hcl"]
    volumes:
      - ../vault-agent/agent.hcl:/vault/agent/agent.hcl:ro
      - ./tls:/vault/tls:ro
      # Credentials are deliberately NOT bind-mounted. A host directory
      # arrives owned by the host user, and Agent — running as the
      # container's vault user — then cannot delete the secret_id after
      # reading it, which silently defeats the whole point of
      # remove_secret_id_file_after_reading.
      #
      # They are piped in with `exec ... 'cat > file'` instead, which
      # writes as the image's user. `compose cp` would not: it writes as
      # root, which is the same problem wearing a different hat. See
      # docs/vault-agent.md.
    environment:
      # No VAULT_TOKEN on purpose. If this container had one, the whole
      # demonstration would be circular.
      VAULT_ADDR: "https://vault-0:8200"
      VAULT_CACERT: "/vault/tls/ca.crt"

  # Auto-unseal backend for vault-0/1/2 (see docker/vault-unseal). Brought up
  # and bootstrapped first — scripts/bootstrap-dev-cluster.sh handles the
  # ordering; a bare `docker compose up` won't unseal or configure it.
  vault-unseal:
    build: ../vault-unseal
    ports:
      - "8300:8200"
    volumes:
      - ./tls:/vault/tls:ro
    environment:
      # The CLI inside the container talks to its own listener, which is
      # now TLS. VAULT_CACERT is what lets it verify the local CA rather
      # than needing -tls-skip-verify, which would defeat the point.
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/vault/tls/ca.crt"

  vault-0:
    build:
      context: ../vault
      args:
        VAULT_NODE_ID: vault-0
    ports:
      - "8200:8200"
    volumes:
      - ./tls:/vault/tls:ro
    environment:
      # The CLI inside the container talks to its own listener, which is
      # now TLS. VAULT_CACERT is what lets it verify the local CA rather
      # than needing -tls-skip-verify, which would defeat the point.
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/vault/tls/ca.crt"
      # Minted by scripts/bootstrap-dev-cluster.sh after vault-unseal is
      # ready; empty here just means "not bootstrapped yet", not a default
      # to rely on.
      VAULT_TRANSIT_TOKEN: "${VAULT_TRANSIT_TOKEN:-}"

  vault-1:
    build:
      context: ../vault
      args:
        VAULT_NODE_ID: vault-1
    ports:
      - "8210:8200"
    volumes:
      - ./tls:/vault/tls:ro
    environment:
      # The CLI inside the container talks to its own listener, which is
      # now TLS. VAULT_CACERT is what lets it verify the local CA rather
      # than needing -tls-skip-verify, which would defeat the point.
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/vault/tls/ca.crt"
      VAULT_TRANSIT_TOKEN: "${VAULT_TRANSIT_TOKEN:-}"

  vault-2:
    build:
      context: ../vault
      args:
        VAULT_NODE_ID: vault-2
    ports:
      - "8220:8200"
    volumes:
      - ./tls:/vault/tls:ro
    environment:
      # The CLI inside the container talks to its own listener, which is
      # now TLS. VAULT_CACERT is what lets it verify the local CA rather
      # than needing -tls-skip-verify, which would defeat the point.
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/vault/tls/ca.crt"
      VAULT_TRANSIT_TOKEN: "${VAULT_TRANSIT_TOKEN:-}"

  # Monitoring — started only by `bootstrap-dev-cluster.sh --with-monitoring`
  # (and therefore `make deploy`), not by a bare `docker compose up`.
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/rules:/etc/prometheus/rules:ro
      # Needed to verify the Vault nodes it scrapes, now that they serve
      # TLS. Without it every scrape fails certificate verification.
      - ./tls/ca.crt:/etc/prometheus/vault-ca.crt:ro

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      # Not a correctness requirement -- Alertmanager retries a webhook
      # whose endpoint is not up yet. It removes a burst of delivery
      # failures from the logs at startup, which otherwise look like the
      # routing being broken when it is only early.
      - alert-sink

  # Where the receivers actually deliver. Alertmanager's own API can say
  # an alert arrived; only something on the receiving end can say which
  # receiver it was routed to, and that is the part of the config worth
  # testing. See docker/alert-sink/sink.py.
  #
  # Each receiver posts to its own path, so the path identifies the
  # receiver. Deliberately not a stand-in for a pager.
  alert-sink:
    build:
      context: ../alert-sink
    # No host port. Alertmanager reaches it on the compose network and
    # the tests read the file with `compose exec`, so publishing it would
    # only add another port to collide with.
    expose:
      - "9097"

  # Where batch jobs record that they succeeded. A snapshot timer that
  # stops running stops pushing, and the absence is what gets alerted on
  # — see docker/monitoring/rules/vault.yml.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports:
      - "9091:9091"

  # Probes the Vault listeners so certificate expiry is measured from
  # what is served, not from what is on disk.
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    ports:
      - "9115:9115"
    volumes:
      - ../monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ./tls/ca.crt:/etc/blackbox/vault-ca.crt:ro

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      # Local/dev only: anonymous admin access so the dashboard opens
      # without a login prompt. Never do this anywhere reachable.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  # Audit logs, kept deliberately separate from every container's
  # lifecycle. See the audit-collector service above.
  audit-logs:

  # Anchors: chain heads, on their own volume so that write access to the
  # audit trail is not also write access to the record of what the trail
  # used to say. The collector has no mount for this at all.
  audit-anchors:
