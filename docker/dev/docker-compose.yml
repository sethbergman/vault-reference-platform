services:
  # OIDC identity provider for human logins (see docker/dex). Started only
  # by `bootstrap-dev-cluster.sh --with-oidc`. The published port matters
  # as much as the internal one: the browser completing a login talks to
  # Dex directly, so it has to be reachable from the host at the same
  # URL Vault uses. See docs/human-authentication.md.
  dex:
    # v2.45.0 is the first release where staticPasswords supports a
    # "groups" field. On anything older the key is silently ignored, the
    # ID token carries no groups claim, and Vault fails the login with
    # 'failed to fetch groups' — with nothing pointing at the version.
    image: dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ../dex/config.yaml:/etc/dex/config.yaml:ro

  # Target for the database secrets engine (see docs/dynamic-secrets.md).
  # Started only by `bootstrap-dev-cluster.sh --with-database`.
  #
  # The credentials here are the *bootstrap* ones Vault uses to connect.
  # scripts/bootstrap-database-secrets.sh rotates the password immediately
  # afterwards, so what is written below stops being valid the moment the
  # engine is configured — which is the point of the exercise. Nothing
  # here is a secret worth protecting; it is deliberately visible so the
  # rotation is observable.
  postgres:
    image: postgres:16.4-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vaultadmin
      POSTGRES_PASSWORD: bootstrap-only-rotated-immediately
      POSTGRES_DB: appdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaultadmin -d appdata"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Auto-unseal backend for vault-0/1/2 (see docker/vault-unseal). Brought up
  # and bootstrapped first — scripts/bootstrap-dev-cluster.sh handles the
  # ordering; a bare `docker compose up` won't unseal or configure it.
  vault-unseal:
    build: ../vault-unseal
    ports:
      - "8300:8200"
    volumes:
      - ./tls:/vault/tls:ro
    environment:
      # The CLI inside the container talks to its own listener, which is
      # now TLS. VAULT_CACERT is what lets it verify the local CA rather
      # than needing -tls-skip-verify, which would defeat the point.
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/vault/tls/ca.crt"

  vault-0:
    build:
      context: ../vault
      args:
        VAULT_NODE_ID: vault-0
    ports:
      - "8200:8200"
    volumes:
      - ./tls:/vault/tls:ro
    environment:
      # The CLI inside the container talks to its own listener, which is
      # now TLS. VAULT_CACERT is what lets it verify the local CA rather
      # than needing -tls-skip-verify, which would defeat the point.
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/vault/tls/ca.crt"
      # Minted by scripts/bootstrap-dev-cluster.sh after vault-unseal is
      # ready; empty here just means "not bootstrapped yet", not a default
      # to rely on.
      VAULT_TRANSIT_TOKEN: "${VAULT_TRANSIT_TOKEN:-}"

  vault-1:
    build:
      context: ../vault
      args:
        VAULT_NODE_ID: vault-1
    ports:
      - "8210:8200"
    volumes:
      - ./tls:/vault/tls:ro
    environment:
      # The CLI inside the container talks to its own listener, which is
      # now TLS. VAULT_CACERT is what lets it verify the local CA rather
      # than needing -tls-skip-verify, which would defeat the point.
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/vault/tls/ca.crt"
      VAULT_TRANSIT_TOKEN: "${VAULT_TRANSIT_TOKEN:-}"

  vault-2:
    build:
      context: ../vault
      args:
        VAULT_NODE_ID: vault-2
    ports:
      - "8220:8200"
    volumes:
      - ./tls:/vault/tls:ro
    environment:
      # The CLI inside the container talks to its own listener, which is
      # now TLS. VAULT_CACERT is what lets it verify the local CA rather
      # than needing -tls-skip-verify, which would defeat the point.
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/vault/tls/ca.crt"
      VAULT_TRANSIT_TOKEN: "${VAULT_TRANSIT_TOKEN:-}"

  # Monitoring — started only by `bootstrap-dev-cluster.sh --with-monitoring`
  # (and therefore `make deploy`), not by a bare `docker compose up`.
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/rules:/etc/prometheus/rules:ro
      # Needed to verify the Vault nodes it scrapes, now that they serve
      # TLS. Without it every scrape fails certificate verification.
      - ./tls/ca.crt:/etc/prometheus/vault-ca.crt:ro

  alertmanager:
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  # Where batch jobs record that they succeeded. A snapshot timer that
  # stops running stops pushing, and the absence is what gets alerted on
  # — see docker/monitoring/rules/vault.yml.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    ports:
      - "9091:9091"

  # Probes the Vault listeners so certificate expiry is measured from
  # what is served, not from what is on disk.
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    ports:
      - "9115:9115"
    volumes:
      - ../monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ./tls/ca.crt:/etc/blackbox/vault-ca.crt:ro

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      # Local/dev only: anonymous admin access so the dashboard opens
      # without a login prompt. Never do this anywhere reachable.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
