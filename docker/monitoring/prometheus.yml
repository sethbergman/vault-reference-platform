global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Rules live in a directory rather than inline so promtool can lint and
# unit-test them independently of this file. See tests/alerting.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: vault
    # The nodes serve TLS with certificates from the local dev CA, so
    # the scheme has to be https and the CA has to be trusted. Using
    # insecure_skip_verify here would make the scrape work while
    # verifying nothing, which is worse than not scraping.
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/vault-ca.crt
      # The targets are addressed by container name, which is what the
      # certificates are issued for, so no name override is needed.
    metrics_path: /v1/sys/metrics
    params:
      format: ["prometheus"]
    static_configs:
      - targets:
          - vault-0:8200
          - vault-1:8200
          - vault-2:8200
    relabel_configs:
      # Default instance label is host:port; the node name alone is what
      # actually distinguishes these three in a dashboard.
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: instance
        replacement: "$1"

  # Batch jobs push here when they succeed. Without this there is no
  # series for a snapshot freshness alert to evaluate, and an alert with
  # no series never fires — which is how snapshots went missing on every
  # node without anything noticing.
  - job_name: pushgateway
    # honor_labels keeps the job and instance labels the pusher set.
    # Without it Prometheus overwrites them with "pushgateway", and every
    # node's snapshot collapses into one indistinguishable series.
    honor_labels: true
    static_configs:
      - targets:
          - pushgateway:9091

  # Probes what the Vault listeners actually serve, rather than what is
  # on disk next to them. See docker/monitoring/blackbox.yml.
  - job_name: vault-tls
    metrics_path: /probe
    params:
      module: ["vault_tls"]
    static_configs:
      - targets:
          - vault-0:8200
          - vault-1:8200
          - vault-2:8200
    relabel_configs:
      # The target being probed travels as a URL parameter; the address
      # Prometheus actually scrapes is the exporter itself.
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
      # Match the node-name-only instance label the vault job uses, so
      # both jobs line up in a dashboard and in alert annotations.
      - source_labels: [instance]
        regex: "([^:]+):.*"
        target_label: instance
        replacement: "$1"
