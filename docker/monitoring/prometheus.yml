global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vault
    # The nodes serve TLS with certificates from the local dev CA, so
    # the scheme has to be https and the CA has to be trusted. Using
    # insecure_skip_verify here would make the scrape work while
    # verifying nothing, which is worse than not scraping.
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/vault-ca.crt
      # The targets are addressed by container name, which is what the
      # certificates are issued for, so no name override is needed.
    metrics_path: /v1/sys/metrics
    params:
      format: ["prometheus"]
    static_configs:
      - targets:
          - vault-0:8200
          - vault-1:8200
          - vault-2:8200
    relabel_configs:
      # Default instance label is host:port; the node name alone is what
      # actually distinguishes these three in a dashboard.
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: instance
        replacement: "$1"
