---
- name: Configure Vault cluster nodes
  hosts: vault_nodes
  become: true
  roles:
    - vault
    - vault_hardening
    # Off unless vault_snapshots_enabled is set; see the role defaults.
    # Ordered last because it asserts on values the vault role's
    # group_vars supply.
    - vault_snapshots
    # Renewal only. The bootstrap certificate comes from the vault role
    # above; see the note at the top of the role's tasks.
    - vault_pki
    # Last, and off by default. This one talks to Vault's API rather than
    # its config file, so it needs a cluster that is already up — and
    # enabling audit logging changes the cluster's availability
    # characteristics, which should be a decision rather than a side
    # effect. See the role defaults.
    - vault_audit
