# Dynamic inventory for the Azure profile.
#
# Mirrors inventory/aws_ec2.yml, for the same reason: the VM scale set
# replaces instances, so a static inventory is wrong as soon as one is
# recycled — and wrong silently.
#
# Unlike the AWS profile, this tag is NOT what Raft discovery matches on.
# go-discover's azure provider rejects a mix of tag and scale-set
# selectors, so retry_join enumerates the scale set by resource group and
# name (see terraform/azure/templates/cloud-init.sh.tftpl).
#
# So the two fail independently here. An empty inventory says nothing
# about whether the cluster formed, and a healthy cluster is no evidence
# this inventory works. Two things to check rather than one.
#
# Usage:
#   cd ansible
#   ansible-inventory -i inventory/azure_rm.yml --graph
#   ansible-playbook -i inventory/azure_rm.yml playbooks/site.yml
#
# Requires the azure.azcollection collection and credentials with reader
# access to the resource group.

plugin: azure.azcollection.azure_rm

# Discovery is across the subscription, filtered by tag below, rather
# than pinned to a resource group name — the group name is a Terraform
# variable and would be a second place to keep in step.
include_vm_resource_groups:
  - "*"

# Every node in this profile is a scale set instance, and the plugin does
# not look at scale sets unless asked: its own documentation says
# "defaults to no VMSS fetch". With only the line above, it enumerates
# standalone virtual machines, finds none, and reports an empty inventory
# with no warning and exit 0 — which is indistinguishable from a cluster
# that has not come up yet.
#
# The first real Azure apply is what found this. Three healthy nodes were
# running, tagged correctly, and `ansible-inventory --list` returned
# nothing at all.
include_vmss_resource_groups:
  - "*"

# Only running instances, only ones carrying the cluster tag.
conditional_groups:
  vault_nodes: "'VaultCluster' in tags"

keyed_groups:
  - key: tags.VaultCluster
    prefix: vault_cluster
    separator: "_"

exclude_host_filters:
  # Skip anything not tagged as part of a Vault cluster.
  - "'VaultCluster' not in (tags | default({}))"
  # Skip instances that are not running — deallocated VMs would
  # otherwise appear as unreachable hosts and fail the run.
  - "powerstate != 'running'"

# Nodes have no public IP and 22 is open only from the Bastion subnet
# (terraform/azure/bastion.tf), so every connection goes through
# `az network bastion tunnel`.
plain_host_names: true

hostvar_expressions:
  # The resource id, not an address. Bastion addresses a target by resource
  # id, and SSH passes %h to the ProxyCommand untouched, so this is what the
  # tunnel needs. aws_ec2.yml plays the same trick with the instance id, for
  # the same reason: what SSH would resolve is not what the tunnel takes.
  #
  # Reaching these nodes another way (bastion_enabled = false, plus a VPN or
  # your own jump host): set this back to private_ipv4_addresses[0] and drop
  # ansible_ssh_common_args below.
  ansible_host: id
  ansible_user: "'azureuser'"

# The ProxyCommand that carries every connection is NOT set here. It used
# to be, and it never reached a single host: the top-level keys of a
# plugin configuration are the plugin's own options, and an unknown one is
# ignored silently rather than rejected. ansible_ssh_common_args is not an
# azure_rm option, so it was read as nothing, and ssh -- given no proxy --
# tried to resolve an Azure resource id as a hostname.
#
# It lives in group_vars/vault_nodes.yml instead, written by
# scripts/terraform-to-ansible.sh beside vault_bastion_name and
# vault_bastion_resource_group, which it interpolates. Anything added here
# that is not an azure_rm option will disappear the same way, so check the
# plugin's documented options before adding one.
