# Dynamic inventory for the AWS profile.
#
# Instances are discovered through the EC2 API by tag rather than listed
# by address. That is not a convenience: the autoscaling group replaces
# nodes, so a static inventory is wrong the first time an instance is
# recycled, and wrong *silently* — the playbook succeeds against hosts
# that no longer exist and never touches the ones that do.
#
# The tag matched here is the same one Vault's retry_join auto_join
# filters on (see terraform/aws/compute.tf). One tag, two consumers: if
# it changes, cluster formation and configuration management break
# together rather than one drifting away from the other.
#
# Usage:
#   cd ansible
#   ansible-inventory -i inventory/aws.yml --graph
#   ansible-playbook -i inventory/aws.yml playbooks/site.yml
#
# Requires the amazon.aws collection and AWS credentials with
# ec2:DescribeInstances.

plugin: amazon.aws.aws_ec2

# Left unset deliberately so the region comes from AWS_REGION or the
# active profile. Hardcoding it here means a second region needs a second
# inventory file that will drift from this one.
regions: []

filters:
  tag:VaultCluster: "*"
  instance-state-name: running

keyed_groups:
  # Produces a group per cluster — vault_cluster_vault_reference and so
  # on — so one control machine can address several clusters without
  # separate inventory files.
  - key: tags.VaultCluster
    prefix: vault_cluster
    separator: "_"

groups:
  # playbooks/site.yml targets vault_nodes, so everything carrying the
  # tag lands there regardless of which cluster it belongs to.
  vault_nodes: "'VaultCluster' in tags"

# Nodes sit in private subnets with no public address, so connections go
# to the private IP. Reaching them needs SSM, a bastion, or a VPN — see
# docs/deployment.md.
#
# The instance id, and deliberately not tag:Name.
#
# An autoscaling group tags every instance it launches identically —
# there is no per-instance interpolation in a launch template — so
# compute.tf gives all three nodes Name=<cluster>-vault. This list is an
# order of *preference*: aws_ec2 takes the first entry that resolves and
# stops, so tag:Name here named all three the same thing, and an Ansible
# inventory is keyed by host name. add_host() returns the existing host,
# set_variable() overwrites its vars, and three nodes collapsed into one
# — the last instance the paginator returned. site.yml then configured a
# single node and exited 0, which is the shape of failure this repository
# exists to refuse: snapshots, audit devices and PKI certificates landing
# on one machine out of three, reported as success.
#
# instance-id rather than private-ip-address because it is the identity
# the node already has: user-data.sh.tftpl derives Raft's node_id from
# the same value, so a host in this inventory and a voter in `vault
# operator raft list-peers` carry one name between them. Azure needs no
# equivalent line — azure_rm defaults to the VM name, which is per
# instance and is also what its cloud-init uses for node_id.
hostnames:
  - instance-id

# Reaching a node: SSH tunnelled through SSM Session Manager.
#
# Nodes have no public address and security.tf opens no port 22 from
# anywhere, so there is nothing to SSH *to* from outside the VPC. Session
# Manager solves that without changing either fact: the agent on the
# instance holds an outbound connection to the SSM service, and
# AWS-StartSSHSession carries an ordinary SSH session back down it. No
# inbound rule, no public IP, no bastion to patch, and the session is
# recorded against the caller's IAM identity rather than against whoever
# holds a key.
#
# `ansible_host` is therefore the instance id and not the private IP:
# `--target` names an instance to SSM, and ProxyCommand's %h is whatever
# Ansible puts in ansible_host. The private IP is no longer routable from
# where the playbook runs, so it would only look correct.
#
# THREE THINGS THIS STILL NEEDS, none of which Terraform can supply:
#
#   - session-manager-plugin on the control machine. The AWS CLI shells
#     out to it and fails with a message about the plugin, not about
#     permissions, which is a confusing way to learn this at apply time.
#     scripts/preflight-cloud.sh checks for it.
#   - ssm:StartSession on YOUR identity, for the AWS-StartSSHSession
#     document. The instance side is already covered — iam.tf attaches
#     AmazonSSMManagedInstanceCore to the node role.
#   - ssh_key_name set on the profile, so EC2 puts your public key in
#     ec2-user's authorized_keys at boot. SSM carries the session; it does
#     not authenticate you to sshd. An empty ssh_key_name still produces a
#     cluster nobody can log into.
#
# Running from *inside* the VPC — a bastion, a VPN, a CI runner in a
# private subnet — wants neither of these: set ansible_host back to
# private_ip_address and drop ansible_ssh_common_args.
compose:
  ansible_host: instance_id

  # AL2023's default user (compute.tf pins the AMI filter to al2023-*).
  # Quoted twice deliberately: compose values are Jinja expressions, so a
  # bare ec2-user would be read as an undefined variable.
  ansible_user: "'ec2-user'"

  # accept-new, not no.
  #
  # It accepts a host key it has not seen and refuses one that changed.
  # That reads as weak until you notice what a host is here: the id is
  # per instance, so a replaced node is a new name with a new key and is
  # correctly unknown, while a *changed* key under an id we have already
  # seen is the case worth refusing. StrictHostKeyChecking=no would
  # accept that too, and pairing accept-new with UserKnownHostsFile
  # /dev/null would throw the refusal away just as thoroughly.
  #
  # It is still trust-on-first-use. Verifying properly means reading the
  # key out of `aws ec2 get-console-output` before the first connection;
  # see docs/deployment.md.
  ansible_ssh_common_args: "'-o StrictHostKeyChecking=accept-new -o ProxyCommand=\"aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p\"'"
