---
- name: Create vault system user
  ansible.builtin.user:
    name: vault
    system: true
    shell: /usr/sbin/nologin

# Spelled per package manager, and exactly as the cloud-init templates
# spell it (terraform/aws/templates/user-data.sh.tftpl, terraform/azure/
# templates/cloud-init.sh.tftpl), so the version the node booted with and
# the version this asks for cannot be two different strings.
#
# It was "vault={{ vault_version }}" for both. That is apt's syntax, and
# not even a complete apt version -- HashiCorp's packages are 1.17.2-1 --
# so dnf answered "No package vault=1.17.2 available" on a node where
# vault-1.17.2-1 was already installed, and the first real run of this
# playbook stopped here on every node. Nothing had run the role against a
# VM before: the local profile is containers.
- name: Install Vault package
  ansible.builtin.package:
    name: >-
      {{ ('vault=' ~ vault_version ~ '-1')
         if ansible_facts['pkg_mgr'] == 'apt'
         else ('vault-' ~ vault_version ~ '-1') }}
    state: present

# ---------------------------------------------------------------------------
# TLS material
# ---------------------------------------------------------------------------
# The cloud user-data deliberately does not issue certificates — it writes
# a config with a TLS listener and lets Vault refuse to start until they
# exist. This is the step that satisfies that, and it is why the handoff
# from Terraform to Ansible matters: Terraform builds hosts that cannot
# serve until something delivers their identity.
- name: Create the TLS directory
  ansible.builtin.file:
    path: "{{ vault_tls_dir }}"
    state: directory
    owner: vault
    group: vault
    mode: "0750"

- name: Install the CA certificate
  ansible.builtin.copy:
    src: "{{ vault_tls_ca_src }}"
    dest: "{{ vault_tls_dir }}/ca.crt"
    owner: vault
    group: vault
    mode: "0644"
  notify: Restart vault

- name: Install the node certificate
  ansible.builtin.copy:
    src: "{{ vault_tls_cert_src }}"
    dest: "{{ vault_tls_dir }}/vault.crt"
    owner: vault
    group: vault
    mode: "0644"
  notify: Restart vault

- name: Install the node private key
  ansible.builtin.copy:
    src: "{{ vault_tls_key_src }}"
    dest: "{{ vault_tls_dir }}/vault.key"
    owner: vault
    group: vault
    # 0600, and no_log, because this is the one file here that is
    # genuinely secret. A private key echoed into a CI log is a leaked
    # private key.
    mode: "0600"
  no_log: true
  notify: Restart vault

# Catches the case where a certificate is delivered for the wrong host —
# the node starts, serves TLS, and its peers reject it during the Raft
# join with an error that points at the network rather than the cert.
#
# -checkip, not -checkhost.
#
# The address is an IP, and -checkhost does hostname matching: against a
# certificate carrying IP:10.0.2.15 it reports "does NOT match", because
# it is looking for a DNS SAN spelled like an address. So this demanded a
# certificate nothing here issues — scripts/issue-node-cert.sh and the
# vault_pki role both put the address in --ip-sans, which is what
# -checkip reads. A correctly issued certificate failed it and the only
# way to pass was to issue a wrong one.
#
# It had never run: the local profile is Docker Compose and does not use
# this role, and neither cloud profile has been applied.
- name: Verify the certificate matches this host
  ansible.builtin.command:
    cmd: >-
      openssl x509 -in {{ vault_tls_dir }}/vault.crt -noout -checkip
      {{ ansible_default_ipv4.address }}
  register: vault_cert_check
  changed_when: false
  # Matched on the output, not the return code. `openssl x509` exits 1 on
  # a mismatch in OpenSSL 3.5 but exits 0 in the 3.0 that Ubuntu ships, so
  # `rc != 0` accepted any certificate at all on exactly the distribution
  # these nodes run — this check never fired.
  failed_when: "'does match' not in vault_cert_check.stdout or 'NOT match' in vault_cert_check.stdout"

# ---------------------------------------------------------------------------
# Configuration
# ---------------------------------------------------------------------------
- name: Deploy Vault configuration
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: /etc/vault.d/vault.hcl
    owner: vault
    group: vault
    mode: "0640"
    # No validate hook: `vault operator diagnose` wants a config
    # directory and tries to reach storage and the listener, so it cannot
    # check a single file in isolation, and there is no parse-only
    # subcommand. A validate that ends in `|| true` would pass on a
    # config Vault cannot read, which is worse than not having one.
    #
    # The health check at the end of this file is the real gate — it only
    # answers once Vault has actually loaded this config.
  notify: Restart vault

- name: Enable and start Vault service
  ansible.builtin.systemd:
    name: vault
    enabled: true
    state: started
    daemon_reload: true

# ---------------------------------------------------------------------------
# Verify
# ---------------------------------------------------------------------------
# A running service is not the same as a working node. sys/health answers
# only once Vault has started, loaded its config and reached a seal state,
# so this is what distinguishes "systemd says active" from "Vault works".
- name: Wait for Vault to respond
  ansible.builtin.uri:
    url: "https://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"
    validate_certs: true
    ca_path: "{{ vault_tls_dir }}/ca.crt"
  register: vault_health
  until: vault_health.status == 200
  retries: 30
  delay: 5
