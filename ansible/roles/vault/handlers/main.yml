---
- name: Restart vault
  # One node at a time. Handlers run at the end of the play across every
  # host at once, so without this a change to vault.hcl -- this role's
  # whole purpose -- restarts all three nodes simultaneously and the
  # cluster has no leader, no quorum, and nothing serving, for as long as
  # it takes them all to come back.
  #
  # A cluster that auto-unseals recovers from that on its own, which is
  # why it has never been noticed. Recovering is not the same as staying
  # up.
  #
  # The packaged unit is Type=notify with NotifyAccess=main -- read off
  # all three nodes of the 2026-09-29 AWS cluster -- so `systemctl restart`
  # returns when Vault has signalled readiness, not when systemd has
  # started the process. This is therefore a real rolling restart: each
  # node is serving again before the next is touched.
  throttle: 1
  ansible.builtin.systemd:
    name: vault
    state: restarted
