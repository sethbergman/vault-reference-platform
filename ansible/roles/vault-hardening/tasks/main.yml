---
- name: Disable swap
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: true

- name: Remove swap entry from fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '^\S+\s+\S+\s+swap\s+'
    state: absent

- name: Restrict Vault API port to internal traffic
  ansible.builtin.iptables:
    chain: INPUT
    destination_port: "8200"
    protocol: tcp
    source: "{{ item }}"
    jump: ACCEPT
  loop: "{{ vault_trusted_cidrs | default([]) }}"
